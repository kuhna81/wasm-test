<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, intitial-scale=1.0'>

		<title>WASM Demo - Primes</title>

		<script src='wasm/primes.js'></script>
		<script defer>


			const isPrime = num => {
				for(let i = 2; i < num; i++) {
					if(num % i === 0) return false;
				}
				return num !== 1 && num !== 0;
			}

			const checkPrimes = num => {
				let count = 0;
				for(let i = 0; i < num; i++) {
					if (isPrime(i)) count++;
				}
				return count;
			}

			const checkToNum = 100000;

			Module.onRuntimeInitialized = () => {
				let cStart = performance.now();
				let cPrimes = _checkPrimes(checkToNum);
				let cTime = performance.now() - cStart;

				let jsStart = performance.now();
				let jsPrimes = checkPrimes(checkToNum);
				let jsTime = performance.now() - jsStart;

				console.log('WASM (C)', cPrimes, Math.round(cTime));
				console.log('JS', jsPrimes, Math.round(jsTime));
			}
		</script>
	</head>
	<body>
		<h1>Prime Number Performance</h1>
	</body>
</html>
