<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, intitial-scale=1.0'>

		<title>WASM Demo - Primes</title>

		<script defer>
			Module.onRuntimeInitialized = () => {
				console.log('WASM ready.');
			}

			const isPrime = num => {
				for(let i = 2; i < num; i++) {
					if(num % i === 0) return false;
				}
				return num !== 1 && num !== 0;
			}

			const checkPrimes = num => {
				let count = 0;
				for(let i = 0; i < num; i++) {
					if (isPrime(i)) count++;
				}
				return count;
			}

			const checkToNum = 100;
