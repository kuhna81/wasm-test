<html>
	<head>
		<meta charset='utf-8'>
		<title>WASM Demo - Primes</title>
		<script src='public/primes.js' defer></script>
		<script defer>
			const isPrime = num => {
				for(let i = 2; i < num; i++) {
					if(num % i === 0) return false;
				}
				return num !== 1 && num !== 0;
			}

			const checkPrimes = num => {
				let count = 0;
				for(let i = 0; i < num; i++) {
					if (isPrime(i)) count++;
				}
				return count;
			}

			const checkToNum = 100;

			Module['onRuntimeInitialized'] = () => {
				let jsStart = performance.now();
				let jsPrimes = checkPrimes(checkToNum);
				console.log('JS', jsPrimes, Math.round(performance.now() - jsStart/1000));

				
				let cStart = performance.now();
				let cPrimes = checkPrimes(checkToNum);
				console.log('WASM (C)', cPrimes, Math.round(performance.now() - cStart/1000));
			}
		</script>
	</head>
	<body>
		<h1>Prime Number Performance</h1>
	</body>
</html>
