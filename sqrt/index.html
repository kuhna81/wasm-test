<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, intitial-scale=1.0'>
		<title>SQRT WASM</title>
		<script src='wasm/sqrt.js'></script>
		<script>
			Module.onRuntimeInitialized = function () {
				const computeSqrt = Module.cwrap ('compute_sqrt', 'number', ['number']);
				window.callSqrt = function () {
					const val = parseFloat(document.getElementById('input').value);
					const result = computeSqrt(val);
					document.getElementById('result').textContent = 'Result: ' + result;
				}
			}
		</script>
	</head>
	<body>
		<h1>Compute sqrt using WASM</h1>
		<input id='input' type='number' value='9' />
		<button onclick='callSqrt()'>Compute</button>
		<p id='result'></p>
	</body>
</html>
